name: aston

# Общий docker-compose для всей системы:
#   инфраструктура -> postgres, kafka, mailhog
#   сервисы        -> config-server, eureka-server, user-service, notification-service, apigateway-server
#
# Запуск:  docker compose up -d --build

services:

  # ------------------------------------------------------------------ инфраструктура

  postgres:
    image: postgres:15-alpine
    container_name: aston-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: user_service
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_service"]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - aston-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: aston-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - aston-net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: aston-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - aston-net

  # ------------------------------------------------------------------ инфраструктура spring cloud

  config-server:
    build:
      context: ./microservices-infrastructure/config-server
      dockerfile: Dockerfile
    container_name: aston-config-server
    restart: unless-stopped
    working_dir: /app
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
    ports:
      - "8888:8888"
    volumes:
      - ./microservices-infrastructure/config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/application/default >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - aston-net

  eureka-server:
    build:
      context: ./microservices-infrastructure/eureka-server
      dockerfile: Dockerfile
    container_name: aston-eureka-server
    restart: unless-stopped
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/eureka/apps >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - aston-net

  # ------------------------------------------------------------------ бизнес-сервисы

  user-service:
    build:
      context: ./intensive/user-service
      dockerfile: Dockerfile
    container_name: aston-user-service
    restart: unless-stopped
    environment:
      # postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: user_service
      DB_USER: postgres
      DB_PASSWORD: 12345678
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345678
      # kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # eureka / config server
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/users >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - aston-net

  notification-service:
    build:
      context: ./intensive/notification-service
      dockerfile: Dockerfile
    container_name: aston-notification-service
    restart: unless-stopped
    environment:
      # kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # smtp (mailhog)
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      # eureka / config server
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/notifications/send | grep -Eq '^[0-9]{3}$'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - aston-net

  apigateway-server:
    build:
      context: ./microservices-infrastructure/apigateway-server
      dockerfile: Dockerfile
    container_name: aston-apigateway-server
    restart: unless-stopped
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8085:8085"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8085/actuator/health | grep -Eq '^[0-9]{3}$'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - aston-net

volumes:
  postgres-data:
  kafka-data:

networks:
  aston-net:
    driver: bridge
